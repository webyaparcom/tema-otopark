<style>
  /* zaman-ilerleme — Kaydırma ilerlemesine bağlı canlı çizgi (scroll-driven); okuyucu tarihçede nerede olduğunu görür. */
  .modulex-zaman-ilerleme { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-zaman-ilerleme *, .modulex-zaman-ilerleme *::before, .modulex-zaman-ilerleme *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-zaman-ilerleme :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-zaman-ilerleme :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-zaman-ilerleme :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-zaman-ilerleme :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-zaman-ilerleme img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-zaman-ilerleme) img { height: auto; }
  .modulex-zaman-ilerleme [hidden] { display: none !important; }
  .modulex-zaman-ilerleme :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-zaman-ilerleme :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-zaman-ilerleme-ic { max-width: --max--; margin-inline: auto; }
  .modulex-zaman-ilerleme-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-zaman-ilerleme--bassiz .modulex-zaman-ilerleme-bas { display: none; }
  .modulex-zaman-ilerleme-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-zaman-ilerleme-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-zaman-ilerleme-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-zaman-ilerleme-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-zaman-ilerleme-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-zaman-ilerleme-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-zaman-ilerleme-dugme:hover { transform: translateY(-2px); }
  .modulex-zaman-ilerleme-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-zaman-ilerleme-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-zaman-ilerleme-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-zaman-ilerleme { --ilerleme: 1; }
  .modulex-zaman-ilerleme-hat { position: relative; display: grid; gap: 28px; padding-inline-start: 64px; }
  .modulex-zaman-ilerleme-hat::before, .modulex-zaman-ilerleme-dolgu { content: ""; position: absolute; inset-block-start: 0; inset-inline-start: 23px; width: 4px; border-radius: 4px; }
  .modulex-zaman-ilerleme-hat::before { inset-block-end: 0; background: --cizgi--; }
  .modulex-zaman-ilerleme-dolgu { height: calc(var(--ilerleme) * 100%); background: --accent--; transition: height 0.15s linear; }
  .modulex-zaman-ilerleme-oge { position: relative; }
  .modulex-zaman-ilerleme-nokta { position: absolute; inset-block-start: 18px; inset-inline-start: -64px; display: inline-grid; place-items: center; width: 50px; height: 50px; border: 4px solid --cizgi--; border-radius: 50%; background: --bg--; color: --muted--; transition: border-color 0.3s ease, background 0.3s ease, color 0.3s ease; }
  .modulex-zaman-ilerleme-nokta .material-symbols-outlined { font-size: 22px; }
  .modulex-zaman-ilerleme-oge { --yandi: clamp(0, (var(--ilerleme) - var(--esik)) * 100 + 1, 1); }
  .modulex-zaman-ilerleme-nokta { border-color: color-mix(in srgb, --accent-- calc(var(--yandi) * 100%), --cizgi--); color: color-mix(in srgb, --accentInk-- calc(var(--yandi) * 100%), --muted--); }
  .modulex-zaman-ilerleme-kart { display: grid; gap: 8px; padding: 24px; border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --kartBg--; transition: transform 0.3s ease; }
  .modulex-zaman-ilerleme-oge:hover .modulex-zaman-ilerleme-kart { transform: translateX(6px); }
  [dir="rtl"] .modulex-zaman-ilerleme-oge:hover .modulex-zaman-ilerleme-kart { transform: translateX(-6px); }
  .modulex-zaman-ilerleme-yil { color: --accentInk--; font-weight: 800; font-variant-numeric: tabular-nums; }
  .modulex-zaman-ilerleme-kbaslik { font-size: 1.2rem; font-weight: 700; }
  .modulex-zaman-ilerleme-kmetin { color: --muted--; }
  @media (max-width: 768px) {
    .modulex-zaman-ilerleme-hat { padding-inline-start: 52px; }
    .modulex-zaman-ilerleme-nokta { inset-inline-start: -52px; width: 42px; height: 42px; }
    .modulex-zaman-ilerleme-hat::before, .modulex-zaman-ilerleme-dolgu { inset-inline-start: 19px; }
  }
  .modulex-zaman-ilerleme-bag { color: inherit; text-decoration: none; }
  .modulex-zaman-ilerleme-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-zaman-ilerleme-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-ilerleme :is(.modulex-zaman-ilerleme-baslik, .modulex-zaman-ilerleme-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-ilerleme-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-zaman-ilerleme { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-zaman-ilerleme *, .modulex-zaman-ilerleme *::before, .modulex-zaman-ilerleme *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-zaman-ilerleme";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ilerleme = (s, P, az) => {
        if (az) { s.style.setProperty("--ilerleme", "1"); return; }
        let bekle = false;
        const hesap = () => {
          bekle = false;
          const r = s.getBoundingClientRect();
          const h = window.innerHeight || 1;
          const v = Math.min(1, Math.max(0, (h * 0.7 - r.top) / (r.height || 1)));
          s.style.setProperty("--ilerleme", v.toFixed(3));
        };
        window.addEventListener("scroll", () => { if (!bekle) { bekle = true; requestAnimationFrame(hesap); } }, { passive: true });
        hesap();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ilerleme(s, P, az);
    });
  })();
</script>
