<section class="modulex-iletisim-daire-ikon{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-iletisim-daire-ikon-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* iletisim-daire-ikon — Kart çerçevesi olmadan ikon odaklı, oyunsu ve hafif; az kanallı küçük işletmelerde boşluğu dengeli doldurur. */
  .modulex-iletisim-daire-ikon { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-iletisim-daire-ikon *, .modulex-iletisim-daire-ikon *::before, .modulex-iletisim-daire-ikon *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-iletisim-daire-ikon :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-iletisim-daire-ikon :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-iletisim-daire-ikon :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-iletisim-daire-ikon :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-daire-ikon img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-iletisim-daire-ikon) img { height: auto; }
  .modulex-iletisim-daire-ikon [hidden] { display: none !important; }
  .modulex-iletisim-daire-ikon :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-iletisim-daire-ikon :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-iletisim-daire-ikon-ic { max-width: --max--; margin-inline: auto; }
  .modulex-iletisim-daire-ikon-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-iletisim-daire-ikon--bassiz .modulex-iletisim-daire-ikon-bas { display: none; }
  .modulex-iletisim-daire-ikon-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-iletisim-daire-ikon-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-iletisim-daire-ikon-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-iletisim-daire-ikon-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-iletisim-daire-ikon-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-iletisim-daire-ikon-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-iletisim-daire-ikon-dugme:hover { transform: translateY(-2px); }
  .modulex-iletisim-daire-ikon-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-iletisim-daire-ikon-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-iletisim-daire-ikon-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-iletisim-daire-ikon-izgara { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 36px 24px; }
  .modulex-iletisim-daire-ikon-oge { display: grid; justify-items: center; align-content: start; gap: 8px; text-align: center; min-width: 0; }
  .modulex-iletisim-daire-ikon-daire { display: grid; place-items: center; width: 104px; height: 104px; margin-block-end: 10px; border-radius: 50%; background: --accent--; color: --accentText--; box-shadow: 0 0 0 10px color-mix(in srgb, --accent-- 14%, transparent); transition: transform 0.5s cubic-bezier(.2,.8,.2,1.2), box-shadow 0.3s ease; }
  .modulex-iletisim-daire-ikon-oge:hover .modulex-iletisim-daire-ikon-daire { box-shadow: 0 0 0 16px color-mix(in srgb, --accent-- 18%, transparent); }
  .modulex-iletisim-daire-ikon-dik { font-size: 44px; }
  .modulex-iletisim-daire-ikon-oge .modulex-iletisim-daire-ikon-deger { font-size: 1.08rem; }
  .modulex-iletisim-daire-ikon--hazir:not(.modulex-iletisim-daire-ikon--gor) .modulex-iletisim-daire-ikon-daire { transform: scale(0.4); }
  .modulex-iletisim-daire-ikon--gor .modulex-iletisim-daire-ikon-daire { transition-delay: calc(var(--i, 0) * 90ms); }
  @media (max-width: 768px) {
    .modulex-iletisim-daire-ikon-izgara { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 14px; }
    .modulex-iletisim-daire-ikon-daire { width: 80px; height: 80px; box-shadow: 0 0 0 7px color-mix(in srgb, --accent-- 14%, transparent); }
    .modulex-iletisim-daire-ikon-dik { font-size: 34px; }
  }
  .modulex-iletisim-daire-ikon-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-daire-ikon-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-daire-ikon-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-daire-ikon-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-daire-ikon-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-daire-ikon-eylem:hover { gap: 10px; }
  .modulex-iletisim-daire-ikon-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-daire-ikon-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-daire-ikon--kjs .modulex-iletisim-daire-ikon-kopya { display: inline-flex; }
  .modulex-iletisim-daire-ikon-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-daire-ikon-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-daire-ikon--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-daire-ikon-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-daire-ikon-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-daire-ikon-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-daire-ikon-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-daire-ikon-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-daire-ikon-cikon { font-size: 18px; }
  .modulex-iletisim-daire-ikon-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-daire-ikon-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-daire-ikon-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-daire-ikon-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-daire-ikon-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-daire-ikon-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-daire-ikon-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-daire-ikon-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-daire-ikon-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-daire-ikon :is(.modulex-iletisim-daire-ikon-baslik, .modulex-iletisim-daire-ikon-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-daire-ikon-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-iletisim-daire-ikon { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-daire-ikon *, .modulex-iletisim-daire-ikon *::before, .modulex-iletisim-daire-ikon *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-daire-ikon";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
